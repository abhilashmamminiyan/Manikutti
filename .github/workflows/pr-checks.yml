name: PR Quality Checks

on:
  pull_request:
    branches:
      - main       # Runs on every PR targeting main
  push:
    branches:
      - "feature/**"  # Also runs on direct pushes to any feature branch

jobs:
  lint-and-build:
    name: Lint & Build Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. ESLint check ─────────────────────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ── 5. Build test ───────────────────────────────────────────────────────
      - name: Run Next.js Build
        run: npm run build

  # ── Auto-merge after all checks pass ─────────────────────────────────────────
  auto-merge:
    name: Auto-merge PR
    runs-on: ubuntu-latest
    needs: lint-and-build            # Only runs if lint-and-build job passed
    if: github.event_name == 'pull_request'  # Only on PRs, not feature pushes

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge PR when checks pass
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
